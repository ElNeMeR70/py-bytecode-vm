[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "py-bytecode-vm"
version = "1.0.0"
description = "Stack-based bytecode virtual machine with JIT hints"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Mahmoud ElNemer", email = "sultanelnemer@gmail.com"}]
keywords = ["python", "bytecode", "vm", "virtual-machine", "compilers"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ElNeMeR70/py-bytecode-vm"
Repository = "https://github.com/ElNeMeR70/py-bytecode-vm"
